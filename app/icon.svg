  <rect width="32" height="32" fill="#f2eee6"/>
  <g fill="none" stroke="#191512" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round">
    <path d="M6 9 H26 L16 25 Z"/>
    <path d="M11 12.5 L16 20.5 L21 12.5"/>
  </g>
</svg>
